<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal da Transparência | INAV</title>
  <meta name="description"
    content="Prestação de contas, relatórios e documentos institucionais do Instituto Nair Valadares." />
  <link rel="stylesheet" href="/src/assets/css/style.css" />
</head>

<body>
  <app-header></app-header>

  <main class="transparencia-page">
    <section class="transparencia-header">
      <h1>Portal da Transparência</h1>
      <p>Acompanhe a aplicação de recursos, balanços contábeis e relatórios do INAV com total clareza e
        responsabilidade.</p>
    </section>

    <section class="filters-container" aria-label="Filtros de Documentos">
      <div class="search-box">
        <label for="search-input" class="sr-only">Buscar documentos</label>
        <input type="text" id="search-input" placeholder="Buscar por título ou descrição..." />
      </div>

      <div class="select-filters">
        <div class="filter-group">
          <label for="category-filter">Categoria:</label>
          <select id="category-filter">
            <option value="todas">Todas as categorias</option>
            <option value="contabil">Balanços e Contabilidade</option>
            <option value="recursos">Execução de Verbas e Parcerias</option>
            <option value="rh">Cargos, Funções e Remuneração</option>
            <option value="institucional">Estatutos e Atas</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="year-filter">Exercício (Ano):</label>
          <select id="year-filter">
            <option value="todos">Todos os anos</option>
            <option value="2026">2026</option>
            <option value="2025">2025</option>
            <option value="2024">2024</option>
          </select>
        </div>
      </div>
    </section>

    <section class="documents-section" aria-live="polite">
      <div class="documents-header">
        <h2>Documentos Públicos</h2>
        <span id="results-count" class="badge">Carregando...</span>
      </div>

      <div id="documents-list" class="documents-grid">
        <!-- Os documentos serão renderizados dinamicamente pelo JS -->
      </div>
    </section>
  </main>

  <script type="module" src="/src/js/app.js"></script>
  <script type="module" src="/src/js/transparencia.js"></script>
</body>

</html>
